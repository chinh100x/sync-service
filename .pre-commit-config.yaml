repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match pyproject.toml's exact ruff== dev dependency -- CI runs
    # `uv run ruff format --check .` (the project's own installed ruff), not
    # this hook, so a version drift between the two is invisible locally
    # (pre-commit passes) but fails for real in CI (real incident: this hook
    # was still on v0.6.9 while the project had drifted to 0.16.3 via an
    # open-ended `ruff>=0.6`, and the two versions disagreed on reformatting
    # two specific lines -- pre-commit reported clean while CI failed on the
    # exact same files, three pushes in a row before it was caught). Bump
    # both together, deliberately, never just one.
    rev: v0.16.3
    hooks:
      - id: ruff-format
      # Import-sort auto-fix only on commit -- the full rule set (unused
      # imports/names, undefined names, bugbear) runs in CI as a real gate,
      # not silently auto-fixed at commit time. See pyproject.toml's
      # [tool.ruff.lint].
      - id: ruff
        args: [--select, I, --fix]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # No --baseline file -- known-fake fixtures (test SHAs, a placeholder
      # sk-test key, deliberately fake secret-shaped strings used to test the
      # scanner itself) are allowlisted inline with `# pragma: allowlist
      # secret` instead, so there's no separate JSON file to keep in sync as
      # new fixtures get added.
      - id: detect-secrets
        exclude: package.lock.json
