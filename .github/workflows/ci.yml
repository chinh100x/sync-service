name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Per 100x Engineering Standards (DAP-273) section 3: gate on lint/format,
  # type check, tests, and a security scan, in that order. No separate build
  # job -- this is a CLI tool, there's no build artifact to produce.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: make install
      - run: uv run ruff format --check .
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: make install
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: make install
      - run: make test

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # trufflehog needs history, not just the tip commit

      - name: Trufflehog (secrets)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Trivy (dependency vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
