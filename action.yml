name: sync-service
description: Propagate a commit from a production repo to its OSS target, opening a PR
inputs:
  config:
    description: The mapping config itself — inline YAML content (not a path), embedded directly in the calling workflow.
    required: true
  target-repo:
    description: "owner/repo of the OSS repo"
    required: true
  target-branch:
    description: Target repo's default branch
    required: false
    default: main
  target-token:
    description: Token with contents:write + pull_requests:write on target-repo (GitHub App installation token or scoped PAT).
    required: true
  base:
    description: Base SHA of the diff to consider (e.g. github.event.before)
    required: true
  head:
    description: Head SHA of the diff to consider (e.g. github.sha)
    required: true
  source-token:
    description: >
      Optional. A token with `contents: write` on the *source* (production)
      repo. Powers a real GitHub comment on the source commit for every
      halt/error (notify.py); without it, that notification still happens via
      the Action's own log and Slack (if configured), just not as a comment
      on the commit itself. In a typical org deployment, `${{ secrets.GITHUB_TOKEN }}`
      (the workflow's own ambient token, already scoped to the repo it runs
      in) is the right value here -- just confirm the job's `permissions:`
      grants `contents: write` (some orgs default GITHUB_TOKEN to read-only).
      Exposed to the process as GITHUB_TOKEN, the standard name `gh` itself
      recognizes.
    required: false
    default: ""
  openai-api-key:
    description: >
      Optional, but powers pr_writer.py's human-readable PR title/body, which is
      on by default (llm_pr.enabled defaults to true). The calling workflow's job
      must declare `environment: production` (or wherever this secret lives) for
      `secrets.OPENAI_API_KEY` to resolve. Never required: with this left empty,
      llm_pr.enabled set to false, or any OpenAI-side failure, the sync falls back
      to a fully deterministic PR title/body.
    required: false
    default: ""
  openai-model:
    description: Optional. Overrides pr_writer.py's default model choice.
    required: false
    default: ""
  openai-safety-model:
    description: >
      Optional. Overrides safety_review.py's default model choice. Only used if a
      mapping config sets `llm_safety_review.enabled: true`. Uses the same
      `secrets.OPENAI_API_KEY` as the PR writer above -- unlike the PR writer,
      enabling this without a working key is a hard failure, not a fallback.
    required: false
    default: ""
  slack-webhook-url:
    description: >
      Optional. A Slack Incoming Webhook URL -- if set, every PR opened and every
      halt/error also gets posted to Slack (notify.py), alongside the GitHub commit
      comment. Best-effort: never required, a broken/missing webhook never affects
      whether the sync itself succeeds.
    required: false
    default: ""
  slack-channel:
    description: >
      Optional. Directs the Slack post at a specific channel, if the configured
      webhook's app honors a channel override (not all do). Ignored entirely if
      slack-webhook-url isn't set.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Checkout target repo
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.target-repo }}
        ref: ${{ inputs.target-branch }}
        token: ${{ inputs.target-token }}
        # actions/checkout refuses a path outside $GITHUB_WORKSPACE (security guard against
        # path traversal), so this has to live inside it — sync_service.scrub hardcodes an
        # exclude for this exact name so a whole-repo mapping never walks into it.
        path: .sync-service-target
        fetch-depth: 0
        # Without this, actions/checkout embeds the token directly into this checkout's
        # .git/config (http.<url>.extraheader) so *any* subsequent git command authenticates
        # automatically -- including break_check's install/run commands, which have this
        # exact directory as their cwd and can read that file as easily as `cat .git/config`.
        # Popping GH_TOKEN out of the process environment (v6) didn't touch this at all; the
        # credential was sitting on disk the whole time. publish.py now authenticates the one
        # git push that actually needs it explicitly, per-call, instead of relying on this.
        persist-credentials: false

    - name: Write mapping config
      shell: bash
      env:
        CONFIG_CONTENT: ${{ inputs.config }}
      run: |
        # Written to the runner's temp dir, not the workspace — same reason as the
        # checkout path above: it must not be inside the tree a whole-repo mapping walks.
        printf '%s\n' "$CONFIG_CONTENT" > "${{ runner.temp }}/sync-service-config.yaml"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1

    - name: Install sync-service
      shell: bash
      # From the checked-out action directory itself, not a re-fetch by URL. Pinning
      # the caller's `uses: chinh100x/sync-service@<sha>` only pins *this file* --
      # a separate `git+https://...` install with no ref always pulls whatever is
      # currently on main, so the actual Python implementation was never pinned by
      # that SHA at all. github.action_path is exactly the checkout that SHA resolved
      # to, so installing from there makes the two inseparable.
      run: uv tool install "${{ github.action_path }}"

    - name: Run sync
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.target-token }}
        # A different token from GH_TOKEN above -- write access to the source
        # (production) repo, not the OSS one -- used only to post a real
        # comment on the source commit when a halt/error happens. Exposed
        # under the standard name, not a custom one.
        GITHUB_TOKEN: ${{ inputs.source-token }}
        # Only reaches pr_writer.py's own process -- breakcheck.py strips this name
        # (alongside GH_TOKEN/GITHUB_TOKEN) before running any far-side install/run
        # command, so break_check (which executes untrusted, far-side-authored
        # commands) never inherits it. See breakcheck.py's _STRIP_ENV_VARS note.
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENAI_PR_MODEL: ${{ inputs.openai-model }}
        OPENAI_SAFETY_MODEL: ${{ inputs.openai-safety-model }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
      run: |
        set -euo pipefail
        sync-service run \
          --config "${{ runner.temp }}/sync-service-config.yaml" \
          --source-repo "${{ github.workspace }}" \
          --dest-repo "${{ github.workspace }}/.sync-service-target" \
          --base "${{ inputs.base }}" \
          --head "${{ inputs.head }}" \
          --base-branch "${{ inputs.target-branch }}"
