[project]
name = "sync-service"
version = "0.1.0"
description = "Prod -> open source sync service (OST-3/4/5 demo implementation)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.60.0",
]

[project.scripts]
sync-service = "sync_service.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_service"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Exact pin, not >= : must match .pre-commit-config.yaml's ruff-pre-commit
    # `rev` exactly. CI runs this installed version directly (`uv run ruff
    # format --check .`), not pre-commit's own hook -- an open-ended bound let
    # the two drift apart silently once before (pre-commit stayed on an old
    # rev while `uv sync` picked up a newer ruff), so pre-commit reported
    # clean locally while CI failed on the same files. Bump both together.
    "ruff==0.16.3",
    "pyright>=1.1",
    "pre-commit>=3.0",
]

[tool.ruff]
line-length = 100  # org standard (100x Engineering Standards, DAP-273)

[tool.ruff.lint]
# Org standard (100x Engineering Standards, DAP-273): pyflakes, a slice of
# pycodestyle, import sort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
