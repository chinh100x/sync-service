[project]
name = "sync-service"
version = "0.1.0"
description = "Prod -> open source sync service (OST-3/4/5 demo implementation)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.60.0",
]

[project.scripts]
sync-service = "sync_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_service"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff.lint]
# Default set (pyflakes + a slice of pycodestyle) is enough here -- unused
# imports/names, undefined names, obvious bugs. Not layering on style rules
# (import sorting, docstring conventions, etc.) beyond what's already the norm.
select = ["E", "F"]
# Comments/lines run long by design (explaining the why, not wrapped to a
# column count) -- a real style choice here, not a gap to close.
ignore = ["E501"]
