[project]
name = "sync-service"
version = "0.1.0"
description = "Prod -> open source sync service (OST-3/4/5 demo implementation)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.60.0",
]

[project.scripts]
sync-service = "sync_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_service"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100  # org standard (100x Engineering Standards, DAP-273)

[tool.ruff.lint]
# Org standard (100x Engineering Standards, DAP-273): pyflakes, a slice of
# pycodestyle, import sort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckMode = "basic"
